<!-- Earnings Summary -->
@if(earnings){
  <div class="p-4 rounded border border-gray-300 bg-gray-100 space-y-2">
    <h3 class="text-lg font-medium mb-2">Earnings Summary</h3>
    <div class="flex justify-between">
      <span>Today</span>
      <span class="font-semibold">{{ earnings.today | currency:currencyCode:'symbol':'1.2-2' }}
</span>
    </div>
    <div class="flex justify-between">
      <span>This Week</span>
      <span class="font-semibold">{{ earnings.thisWeek | currency:currencyCode:'symbol':'1.2-2' }}
</span>
    </div>
    <div class="flex justify-between">
      <span>Last 30 Days</span>
      <span class="font-semibold">{{ earnings.last30Days | currency:currencyCode:'symbol':'1.2-2' }}
</span>
    </div>
  </div>
}
