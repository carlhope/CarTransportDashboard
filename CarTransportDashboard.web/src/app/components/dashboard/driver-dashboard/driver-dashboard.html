<div class="flex flex-col h-full w-full p-4 gap-4">

  <!-- Tabs -->
  <app-job-tabs
    [activeTab]="selectedTab"
    (tabChange)="onTabChange($event)"
    class="w-full">
  </app-job-tabs>

  <!-- Main content area -->
  <div class="flex flex-1 gap-4">

    <!-- Job list -->
    <app-job-list
      [jobs]="filteredJobs"
      [selectedJob]="selectedJob"
      (jobSelected)="onJobSelected($event)"
      class="w-1/3 min-w-[260px] bg-white rounded-lg shadow-sm p-3">
    </app-job-list>

    <!-- Detail + Map -->
    <div class="relative flex-1">

      <!-- Map fills the entire area -->
      <app-job-map class="w-full h-full rounded-lg overflow-hidden"></app-job-map>

      <!-- Floating job detail card, centred -->
      <div class="absolute inset-x-0 bottom-4 flex justify-center">
        <app-job-detail class="w-full max-w-2xl bg-white rounded-lg shadow-lg p-4"
          [job]="selectedJob"
          (accept)="acceptJob($event)"
          (decline)="declineJob($event)"
          (complete)="completeJob($event)"
          (cancel)="requestCancellation($event)"
        >
        </app-job-detail>
      </div>

    </div>

  </div>

  <!-- Earnings summary -->
  <app-earnings-summary
    [earnings]="earnings"
    class="w-full bg-white rounded-lg shadow-sm p-4"
  ></app-earnings-summary>

</div>
