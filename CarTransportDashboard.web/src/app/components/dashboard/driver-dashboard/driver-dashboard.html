<div class="flex flex-col h-full w-full gap-4 bg-gray-200">



  <!-- Main content area -->
  <div class="flex flex-1 gap-4">
    <div class="w-1/3 min-w-[260px] p-3">
  <!-- Tabs -->
  <app-job-tabs
    [activeTab]="selectedTab()"
    [activeCount]="activeCount()"
    [allocatedCount]="allocatedCount()"
    [completedCount]="completedCount()"
    (tabChange)="onTabChange($event)"
    class="w-full">
  </app-job-tabs>
    <!-- Job list -->
    <app-job-list
      [jobs]="filteredJobs()"
      [selectedJob]="selectedJob()"
      (jobSelected)="onJobSelected($event)"
      class="w-full">
    </app-job-list>
    </div>

    <!-- Detail + Map -->
    <div class="relative flex-1">

      <!-- Map fills the entire area -->
      <app-job-map [polyline]="selectedJob()?.polyline" class="w-full h-full rounded-lg overflow-hidden"></app-job-map>

      <!-- Floating job detail card, centred -->
      <div class="absolute inset-x-0 bottom-4 flex justify-center">
        <app-job-detail class="w-full max-w-2xl rounded-lg shadow-lg p-4 bg-white/40 backdrop-blur-md"
          [job]="selectedJob()"
          (accept)="acceptJob($event)"
          (decline)="declineJob($event)"
          (complete)="completeJob($event)"
          (cancel)="requestCancellation($event)"
        >
        </app-job-detail>
      </div>

    </div>

  </div>

  <!-- Earnings summary -->
  <app-earnings-summary
    [earnings]="earnings()"
    class="w-full rounded-lg shadow-sm p-4"
  ></app-earnings-summary>

</div>
