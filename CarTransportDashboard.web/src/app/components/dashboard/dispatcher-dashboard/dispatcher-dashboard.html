<div class="flex flex-col h-full w-full gap-4 bg-gray-200">



  <!-- Main content area -->
  <div class="flex flex-1 gap-4">
    <div class="w-1/3 min-w-[260px] bg-blue-500 p-3">
      <!-- Tabs -->
      <div class="w-full">
        <!--needs refactor as this dashboard has both transportJob and driverModel lists. placeholders in place to ensure builds.-->
        <app-job-tabs
          [activeTab]="selectedTab()"
          (tabChange)="onTabChange($event)"
          class="w-full">
        </app-job-tabs>
      </div>

      <div class="w-full">
        <app-job-list
          [jobs]="availableJobs()"
          (jobSelected)="onSelectedJobChange(JobStatus.InProgress)">
        </app-job-list>

      </div>
    </div>

    <!-- Detail + Map -->
    <div class="relative flex-1">

      <!-- Map fills the entire area -->
      <div class="w-full h-full rounded-lg bg-yellow-200 overflow-hidden">
        <!-- Map showing jobs / drivers -->
        <p>maps placeholder</p>
      </div>

      <div class="absolute inset-x-0 bottom-4 flex justify-center">
        <div class="w-full max-w-2xl rounded-lg shadow-lg p-4 bg-white/40 backdrop-blur-md">
          <!-- future details card -->
          <p>Details card</p>
        </div>
      </div>

    </div>

  </div>

</div>
