<div class="flex flex-col h-full w-full gap-4 bg-gray-200">



  <!-- Main content area -->
  <div class="flex flex-1 gap-4">
    <div class="w-1/3 min-w-[260px] bg-blue-500 p-3">
      <!-- Tabs -->
      <h1>If seeing this without being logged in as dispatcher,
        I removed access restrictions for ease of development
      </h1>
      <div class="w-full">
        <app-dispatcher-tabs
          [activeTab]="selectedTab()"
          [jobCount]="jobCount()"
          [driverCount]="driverCount"
          (tabChange)="onTabChange($event)"
          class="w-full">
        </app-dispatcher-tabs>
      </div>

      <div class="w-full">
        @switch (selectedTab()){

          @case ("Jobs"){
            <app-job-list
              [jobs]="availableJobs()"
              (jobSelected)="onSelectedJobChange($event)">
            </app-job-list>
          }
          @case ("Drivers"){
            <app-driver-list
              [drivers]="allocatedDrivers()"
              (driverSelected)="onSelectedDriverChange($event)"
            >

            </app-driver-list>
          }
          @default {
            <p>Something went wrong</p>
          }

        }


      </div>
    </div>

    <!-- Detail + Map -->
    <div class="relative flex-1">

      <!-- Map fills the entire area -->
      <div class="w-full h-full rounded-lg bg-yellow-200 overflow-hidden">
        <!-- Map showing jobs / drivers -->
        <p>maps placeholder</p>
      </div>

      <div class="absolute inset-x-0 bottom-4 flex justify-center">
        <div class="flex justify-center w-full min-w-2 py-4 mx-2 rounded-lg shadow-lg bg-white/40 backdrop-blur-md">
        <!-- future details card -->
          <p>Details card</p>
        </div>
      </div>

    </div>

  </div>

</div>
